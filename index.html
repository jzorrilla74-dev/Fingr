<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fingr">
<meta name="application-name" content="Fingr">
<meta name="theme-color" content="#5BBCB8">
<meta name="description" content="Bb trumpet fingering reference tool">
<title>Fingr</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-grid">
      <div class="logo-dot filled"></div>
      <div class="logo-dot filled"></div>
      <div class="logo-dot filled"></div>
      <div class="logo-dot filled"></div>
      <div class="logo-dot filled"></div>
      <div class="logo-dot"></div>
      <div class="logo-dot filled"></div>
      <div class="logo-dot"></div>
      <div class="logo-dot"></div>
    </div>
    <span class="logo-wordmark">FINGR</span>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-transient">Transient</button>
    <button class="mode-btn" id="btn-persistent">Persistent</button>
  </div>

  <div class="topbar-selectors">
    <select id="type-select">
      <option value="chromatic">Chromatic</option>
      <optgroup label="Major"><option value="major">Major</option></optgroup>
      <optgroup label="Minor">
        <option value="natural_minor">Natural Minor</option>
        <option value="harmonic_minor">Harmonic Minor</option>
        <option value="melodic_minor">Melodic Minor</option>
      </optgroup>
      <optgroup label="Jazz Modes">
        <option value="dorian">Dorian</option>
        <option value="mixolydian">Mixolydian</option>
        <option value="lydian">Lydian</option>
        <option value="phrygian">Phrygian</option>
        <option value="locrian">Locrian</option>
        <option value="lydian_dominant">Lydian Dominant</option>
        <option value="altered">Altered</option>
      </optgroup>
      <optgroup label="Pentatonic / Blues">
        <option value="major_pent">Major Pentatonic</option>
        <option value="minor_pent">Minor Pentatonic</option>
        <option value="blues">Blues</option>
      </optgroup>
    </select>

    <select id="root-select" style="display:none;">
      <option value="C">C</option><option value="Cs">C♯</option>
      <option value="D">D</option><option value="Ds">D♯</option>
      <option value="E">E</option><option value="F">F</option>
      <option value="Fs">F♯</option><option value="G">G</option>
      <option value="Gs">G♯</option><option value="A">A</option>
      <option value="As">A♯</option><option value="B">B</option>
    </select>

    <span class="scale-info" id="scale-info">F♯3 — C6</span>
  </div>

  <button class="theme-btn" id="theme-btn" title="Toggle theme">☀</button>
</div>

<!-- MAIN -->
<div class="main">
  <div class="staff-panel">
    <div class="staff-scroll">
      <svg id="staff-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="finger-panel" id="finger-panel">
    <div class="fp-empty">Tap any note<br>on the staff</div>
  </div>
</div>

<!-- PERSISTENT PANEL -->
<div class="persist-panel" id="persist-panel">
  <div class="persist-scroll" id="persist-scroll"></div>
  <button class="persist-clear" id="persist-clear">Clear all</button>
</div>

<!-- Scripts loaded in dependency order, no ES6 modules needed -->
<script src="js/notes.js"></script>
<script src="js/scales.js"></script>
<script src="js/audio.js"></script>
<script src="js/staff.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
